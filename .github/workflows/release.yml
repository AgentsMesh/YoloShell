name: Release
run-name: Release ${{ github.event.client_payload.tag || inputs.tag }}

on:
  repository_dispatch:
    types: [yolo-release]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
      version:
        description: Release version
        required: true
      prerelease:
        description: Prerelease (true or false)
        required: false
        default: "false"
      name:
        description: Release name
        required: false
      source_sha:
        description: Source commit
        required: false

permissions:
  contents: write

concurrency:
  group: yolo-release
  cancel-in-progress: false

env:
  YOLO_RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
  YOLO_RELEASE_VERSION: ${{ github.event.client_payload.version || inputs.version }}
  YOLO_RELEASE_PRERELEASE: ${{ github.event.client_payload.prerelease || inputs.prerelease || 'false' }}
  YOLO_RELEASE_NAME: ${{ github.event.client_payload.name || inputs.name || format('YoloShell {0}', inputs.version) }}
  CI_COMMIT_SHA: ${{ github.event.client_payload.source_sha || inputs.source_sha || github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Bazelisk
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bazel" \
            "https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64"
          chmod +x "$RUNNER_TEMP/bazel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Conformance
        run: >-
          bazel test //build_system/architecture:conformance_test
          --spawn_strategy=local --test_output=errors --cache_test_results=no

  build-linux-amd64:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux amd64
        run: sh scripts/release/build-linux.sh x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/*.tar.gz

  build-linux-arm64:
    needs: verify
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux arm64
        run: sh scripts/release/build-linux.sh aarch64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: dist/*.tar.gz

  build-macos-arm64:
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - name: Build macOS arm64
        run: sh scripts/release/build.sh aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.tar.gz

  publish:
    needs: [build-linux-amd64, build-linux-arm64, build-macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: sh scripts/release/publish-github.sh dist
