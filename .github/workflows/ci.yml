name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Web client unit tests
        working-directory: plugins/web/client
        run: bun test
      - name: Web client browser build
        working-directory: plugins/web/client
        run: bun build browser/main.ts --target=browser --outdir "$RUNNER_TEMP/web"
      - name: Web server build
        working-directory: plugins/web/client
        run: bun build scripts/plugin.ts server/index.ts --target=bun --outdir "$RUNNER_TEMP/server"

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Bazelisk
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bazel" \
            "https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64"
          chmod +x "$RUNNER_TEMP/bazel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Conformance and unit tests
        run: >-
          bazel test
          //build_system/architecture:conformance_test
          //core/crates/application/upgrade/cli:unit_tests
          --spawn_strategy=local --test_output=errors --cache_test_results=no
      - name: Build YoloShell
        run: bazel build --spawn_strategy=local -c opt //core:yolo

  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - name: Install Bazelisk
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bazel" \
            "https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-darwin-arm64"
          chmod +x "$RUNNER_TEMP/bazel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build YoloShell
        run: bazel build --spawn_strategy=local -c opt //core:yolo
