name: Feature request
description: Propose a focused capability or contract change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user workflow or invariant is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest responsible design and its boundary.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What did you consider, and why is it insufficient?
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and security impact
      description: Note wire, provider, plugin, browser or custody effects.
    validations:
      required: false
