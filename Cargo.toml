[package]
name = "yolo-runtime"
version = "0.1.2"
edition = "2024"
rust-version = "1.93.1"
license = "MIT"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
build = false

[lib]
name = "yolo_dependency_metadata"
path = "build_system/bazel/cargo_metadata/src/lib.rs"
test = false
doctest = false
bench = false

[dependencies]
anyhow = "1.0"
base64 = "0.22"
capnp = { version = "=0.27.2", features = ["unaligned"] }
capnp-futures = "=0.27.0"
capnp-rpc = "=0.27.0"
capnpc = "=0.27.0"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
getrandom = "0.4"
hmac = "0.12"
libc = "0.2"
portable-pty = "0.9"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
rmp-serde = "1.3"
ring = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
russh = { version = "0.62.4", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
serde-value = "=0.7.0"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6.1"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-tungstenite = "=0.28.0"
url = "=2.5.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-segmentation = "1.13"
uuid = { version = "1.18", features = ["serde", "v4"] }
vt100 = "=0.16.2"
vte = "=0.15.0"
zeroize = "1.8"

[dev-dependencies]
regex = "1.12"
tempfile = "3.20"
